name: Mise à jour des places disponibles

on:
  repository_dispatch:
    types: [update-places-image]

permissions:
  contents: write

jobs:
  update-image:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v6

      - name: Créer le PNG depuis Power Automate
        env:
          IMAGE_BASE64: ${{ github.event.client_payload.image }}
        run: |
          echo "$IMAGE_BASE64" | base64 --decode > places-disponibles.png

      - name: Commit et publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add places-disponibles.png
          git diff --cached --quiet || git commit -m "Actualisation des places disponibles"
          git push
